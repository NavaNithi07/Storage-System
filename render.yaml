services:
  - type: web
    name: vibna-storage-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --production=false
    startCommand: node server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Add ALL backend secrets in Render dashboard → Environment ──────────
      # DATABASE_URL              → Neon PostgreSQL connection string
      # JWT_SECRET                → JWT signing secret
      # JWT_REFRESH_SECRET        → JWT refresh token secret
      # CLOUDINARY_CLOUD_NAME     → Cloudinary cloud name
      # CLOUDINARY_API_KEY        → Cloudinary API key
      # CLOUDINARY_API_SECRET     → Cloudinary API secret
      # FIREBASE_PROJECT_ID       → vibna-storage
      # FIREBASE_CLIENT_EMAIL     → Firebase service account email
      # FIREBASE_PRIVATE_KEY      → Firebase service account private key
      # FRONTEND_URL              → https://your-frontend-url.vercel.app
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS → Email credentials
    healthCheckPath: /health
    # Render free tier spins down after inactivity — keep-alive is handled by /health
